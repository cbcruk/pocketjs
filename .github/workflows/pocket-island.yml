name: Pocket Island
on:
  pull_request:
    paths: ['engine/pocket3d/crates/pocket3d-anim/**', 'engine/pocket3d/backends/citro3d/**', 'engine/pocket3d/examples/island/**', 'tools/island.ts', '.github/workflows/pocket-island.yml']
  push:
    branches: [main]
    paths: ['engine/pocket3d/crates/pocket3d-anim/**', 'engine/pocket3d/backends/citro3d/**', 'engine/pocket3d/examples/island/**', 'tools/island.ts', '.github/workflows/pocket-island.yml']
permissions:
  contents: read
jobs:
  island:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: rustup toolchain install nightly-2026-07-02 --profile minimal --component rust-src
      - name: Portable animation, movement and chat contracts
        run: bun tools/island.ts test
      - name: Build native PICA200 app
        run: bun tools/island.ts build
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-island-3ds
          path: dist/island/release/pocket-island.3dsx
